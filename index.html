<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tecvid Dedektif</title>
<meta name="description" content="Tecvid Dedektif: oefen tecvid-regels met korte spellen. Tecvid kurallarını kısa oyunlarla öğren. Nederlands en Türkçe.">
<link rel="stylesheet" href="css/stil.css">
</head>
<body>

<!-- Üst şerit ve gövde boş başlar. İçlerini js/uygulama.js doldurur. -->
<header class="ust" id="ust"></header>
<main class="kap" id="govde"></main>

<footer class="alt kap">
  <p>Deze app vraagt geen account en verzamelt geen gegevens. <span class="tr" lang="tr">Bu uygulama üyelik istemez ve hiçbir veri toplamaz.</span></p>
</footer>

<noscript><p class="kap">Deze app heeft JavaScript nodig. · Bu uygulama için JavaScript açık olmalı.</p></noscript>

<!-- QR penceresi: qr.png bu sitenin adresine gider -->
<div class="qr-perde" id="qr-perde" hidden role="dialog" aria-label="QR-code">
  <div class="qr-kart">
    <img src="qr.png" alt="QR-code naar Tecvid Dedektif">
    <h3>Scan met je telefoon</h3>
    <p lang="tr">Telefonunla tara · Tecvid Dedektif</p>
    <button type="button" id="qr-kapat">Sluiten · Kapat</button>
  </div>
</div>

<!--
  Kod dosyaları. Sıra önemli:
  1. çekirdek   2. parçalar (kelime, oyun, sayaç)   3. içerik listeleri   4. uygulamayı başlatan dosya
  Konu dosyaları (konular/*.js) buraya yazılmaz, konular/liste.js içindeki listeden kendiliğinden yüklenir.
-->
<script src="js/tecvid.js"></script>
<script src="js/kelime.js"></script>
<script src="js/oyun.js"></script>
<script src="js/sayac.js"></script>
<script src="konular/turler.js"></script>
<script src="konular/liste.js"></script>
<script src="js/uygulama.js"></script>
</body>
</html>
